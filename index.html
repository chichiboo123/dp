  const fontIndexOf = (name) => { const i = FONT_OPTIONS.findIndex(f => f.name === name); return i < 0 ? 0 : i; };
  const alignCode = (a) => (a === 'center' ? 1 : a === 'right' ? 2 : 0);
  const alignName = (c) => (c === 1 ? 'center' : c === 2 ? 'right' : 'left');
  const primaryFamily = (name) => (name || FONT_OPTIONS[0].name).split(',')[0].trim();

  const b64encodeUnicode = (str) => btoa(unescape(encodeURIComponent(str)));
  const b64decodeUnicode = (str) => decodeURIComponent(escape(atob(str)));

  // Compact array-based encoding keeps the share URL short.
  const serializeElements = (els) => {
    if (!els || !els.length) return '';
    const compact = els.map((e) => {
      if (e.type === 'checkbox') return [1, e.page, round4(e.x), round4(e.y), round4(e.w), round4(e.h), e.checked ? 1 : 0];
      return [0, e.page, round4(e.x), round4(e.y), round4(e.w), round4(e.h), e.text || '', fontIndexOf(e.fontFamily), e.fontSize, e.color || DEFAULT_TEXT_COLOR, e.bold ? 1 : 0, alignCode(e.align)];
    });
    try { return b64encodeUnicode(JSON.stringify(compact)); } catch (_) { return ''; }
  };

  const deserializeElements = (str) => {
    if (!str) return [];
    try {
      const arr = JSON.parse(b64decodeUnicode(str));
      if (!Array.isArray(arr)) return [];
      return arr.map((a, i) => {
        const common = { id: genId('e' + i), page: a[1], x: a[2], y: a[3], w: a[4], h: a[5] };
        if (a[0] === 1) return { ...common, type: 'checkbox', checked: a[6] === 1 };
        return { ...common, type: 'text', text: a[6] || '', fontFamily: FONT_OPTIONS[a[7]] ? FONT_OPTIONS[a[7]].name : FONT_OPTIONS[0].name, fontSize: a[8] || 24, color: a[9] || DEFAULT_TEXT_COLOR, bold: a[10] === 1, align: alignName(a[11]) };
      });
    } catch (err) {
      console.warn('[DigitalPaper] element decode failed', err);
      return [];
    }
  };

  // ── Canvas helpers for exporting fields onto the flattened image ──────────
  const roundRectPath = (ctx, x, y, w, h, r) => {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  };

  const drawCheckboxCanvas = (ctx, x, y, w, h, checked) => {
    const s = Math.min(w, h);
    const r = s * 0.2;
    ctx.save();
    ctx.lineWidth = Math.max(1.5, s * 0.08);
    ctx.strokeStyle = checked ? '#16A34A' : '#64748B';
    ctx.fillStyle = checked ? '#DCFCE7' : '#FFFFFF';
    roundRectPath(ctx, x, y, s, s, r);
    ctx.fill();
    ctx.stroke();
    if (checked) {
      ctx.strokeStyle = '#15803D';
      ctx.lineWidth = Math.max(2, s * 0.13);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x + s * 0.24, y + s * 0.52);
      ctx.lineTo(x + s * 0.43, y + s * 0.72);
      ctx.lineTo(x + s * 0.77, y + s * 0.27);
      ctx.stroke();
    }
    ctx.restore();
  };

  // Word-wrap that also breaks long unbroken tokens (e.g. Korean/뭉친 글자) by character.
  const wrapCanvasText = (ctx, text, maxWidth) => {
    const out = [];
    const paragraphs = String(text == null ? '' : text).split('\n');
    for (const para of paragraphs) {
      if (para === '') { out.push(''); continue; }
      let line = '';
      const tokens = para.match(/\s+|[^\s]+/g) || [];
      const pushBroken = (token, prefix) => {
        let chunk = prefix;
        for (const ch of token) {
          if (chunk !== '' && ctx.measureText(chunk + ch).width > maxWidth) { out.push(chunk); chunk = ch; }
          else chunk += ch;
        }
        return chunk;
      };
      for (const token of tokens) {
        const test = line + token;
        if (ctx.measureText(test).width <= maxWidth) { line = test; continue; }
        if (line !== '') { out.push(line.replace(/\s+$/, '')); line = ''; }
        if (ctx.measureText(token).width > maxWidth) line = pushBroken(token, '');
        else line = token;
      }
      out.push(line);
    }
    return out;
  };

  // ptToPx converts a font size (points relative to the unscaled PDF page) to canvas pixels.
  const renderElementsOnCanvas = (ctx, els, pageW, pageH, ptToPx) => {
    if (!els || !els.length) return;
    for (const el of els) {
      const x = el.x * pageW, y = el.y * pageH, w = el.w * pageW, h = el.h * pageH;
      if (el.type === 'checkbox') { drawCheckboxCanvas(ctx, x, y, w, h, el.checked); continue; }
      const text = el.text || '';
      if (!text.trim()) continue;
      const fontPx = Math.max(1, el.fontSize * ptToPx);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.font = `${el.bold ? '700' : '400'} ${fontPx}px ${el.fontFamily}`;
      ctx.fillStyle = el.color || DEFAULT_TEXT_COLOR;
      ctx.textBaseline = 'top';
      const pad = fontPx * 0.2;
      const lh = fontPx * TEXT_LINE_HEIGHT;
      const maxW = Math.max(1, w - pad * 2);
      const lines = wrapCanvasText(ctx, text, maxW);
      let ty = y + pad + (lh - fontPx) / 2;
      for (const line of lines) {
        let tx = x + pad;
        if (el.align === 'center') { tx = x + (w - ctx.measureText(line).width) / 2; }
        else if (el.align === 'right') { tx = x + w - pad - ctx.measureText(line).width; }
        ctx.fillText(line, tx, ty);
        ty += lh;
      }
      ctx.restore();
    }
  };

  const ensureFontsLoaded = async (els) => {
    if (!document.fonts || !els || !els.length) return;
    const families = new Set();
    els.forEach((e) => { if (e.type !== 'checkbox') families.add(primaryFamily(e.fontFamily)); });
    const tasks = [];
    families.forEach((fam) => {
      try { tasks.push(document.fonts.load(`400 24px ${fam}`)); tasks.push(document.fonts.load(`700 24px ${fam}`)); } catch (_) {}
    });
    try { await Promise.all(tasks); } catch (_) {}
    try { await document.fonts.ready; } catch (_) {}
  };

  // Treat a raster image (JPG/PNG) as a 1-page "document" that exposes the tiny
  // slice of the pdf.js page API the app relies on (getViewport / render). This lets
  // the whole render + annotation + export pipeline stay identical for PDFs & images.
  const makeImageDoc = (img) => {
    const W = Math.max(1, img.naturalWidth || img.width);
    const H = Math.max(1, img.naturalHeight || img.height);
    const page = {
      getViewport: ({ scale = 1 } = {}) => ({ width: W * scale, height: H * scale, scale }),
      render: ({ canvasContext }) => ({
        promise: new Promise((resolve) => {
          const c = canvasContext.canvas;
          try { canvasContext.drawImage(img, 0, 0, c.width, c.height); } catch (_) {}
          resolve();
        }),
      }),
    };
    return { numPages: 1, isImage: true, getPage: () => Promise.resolve(page) };
  };

  // Sniff the first bytes so shared links (which carry no MIME type) still pick the
  // right loader. Anything unrecognized falls back to the PDF parser.
  const detectDocKind = (buf) => {
    const b = new Uint8Array(buf, 0, Math.min(8, buf.byteLength || 0));
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image'; // PNG
    if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image';                   // JPEG
    return 'pdf';
  };

  // Canva-style floating toolbar for the selected text field. Rendered fixed near
  // the top so it never covers the field being edited. Used by both teacher & student.
  // Pop-up panels (font/size/color) render BELOW the row — outside the horizontal
  // scroller — so the long font list is easy to scroll on phones.
  function TextFormatToolbar({ el, onChange, onDelete, canDelete, onClose, t }) {
    const [menu, setMenu] = useState(''); // '', 'font', 'size', 'color'
    const toggle = (m) => setMenu((prev) => (prev === m ? '' : m));
    const curFont = FONT_OPTIONS.find((f) => f.name === el.fontFamily) || FONT_OPTIONS[0];
    const btn = 'h-10 min-w-[40px] px-2 rounded-xl border flex items-center justify-center gap-1 text-sm font-semibold transition-colors shrink-0';
    const plain = 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50';
    const active = 'bg-blue-100 border-blue-300 text-blue-800';
    const curSize = Math.round(el.fontSize);
    return (
      <div className="fixed top-[58px] sm:top-[64px] left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-1rem)] sm:w-auto max-w-[calc(100vw-1rem)]" onPointerDown={(e) => e.stopPropagation()}>
        <div className="relative">
          <div className="rounded-2xl border border-slate-200 bg-white/95 backdrop-blur-md shadow-xl px-1.5 py-1.5 flex items-center gap-1 overflow-x-auto flex-nowrap">
            {/* Font family */}
            <button className={`${btn} ${menu === 'font' ? active : plain}`} onClick={() => toggle('font')} title={t.font} style={menu === 'font' ? undefined : { fontFamily: el.fontFamily }}>
              <span className="material-icons text-[18px]">font_download</span>
              <span className="max-w-[84px] sm:max-w-[110px] truncate">{curFont.label}</span>
              <span className="material-icons text-[16px] text-slate-400">expand_more</span>
            </button>

            {/* Font size */}
            <div className="flex items-center gap-0.5 shrink-0">
              <button className={`${btn} ${plain} !min-w-0 !px-0 w-9`} title={t.sizeDown} onClick={() => onChange({ fontSize: clamp(curSize - 1, 6, 200) })}><span className="material-icons text-[18px]">remove</span></button>
              <button className={`${btn} ${menu === 'size' ? active : plain} !px-2`} onClick={() => toggle('size')} title={t.size}><span className="tabular-nums">{curSize}</span></button>
              <button className={`${btn} ${plain} !min-w-0 !px-0 w-9`} title={t.sizeUp} onClick={() => onChange({ fontSize: clamp(curSize + 1, 6, 200) })}><span className="material-icons text-[18px]">add</span></button>
            </div>

            <div className="w-px h-6 bg-slate-200 shrink-0" />

            {/* Color */}
            <button className={`${btn} ${menu === 'color' ? active : plain} !min-w-0 !px-2`} onClick={() => toggle('color')} title={t.color}>
              <span className="material-icons text-[18px]">format_color_text</span>
              <span className="w-4 h-4 rounded-full border border-slate-300 shadow-inner" style={{ background: el.color }} />
            </button>

            {/* Bold */}
            <button className={`${btn} ${el.bold ? active : plain} !min-w-0 w-10`} title={t.bold} onClick={() => onChange({ bold: !el.bold })}>
              <span className="material-icons text-[18px]">format_bold</span>
            </button>

            <div className="w-px h-6 bg-slate-200 shrink-0" />

            {/* Align */}
            {[['left', 'format_align_left'], ['center', 'format_align_center'], ['right', 'format_align_right']].map(([a, icon]) => (
              <button key={a} className={`${btn} ${el.align === a ? active : plain} !min-w-0 w-10`} title={t['align_' + a]} onClick={() => onChange({ align: a })}>
                <span className="material-icons text-[18px]">{icon}</span>
              </button>
            ))}

            <div className="w-px h-6 bg-slate-200 shrink-0" />

            {canDelete && (
              <button className={`${btn} bg-white border-red-200 text-red-600 hover:bg-red-50 !min-w-0 w-10`} title={t.deleteField} onClick={onDelete}>
                <span className="material-icons text-[18px]">delete</span>
              </button>
            )}
            <button className={`${btn} bg-slate-800 border-slate-800 text-white hover:bg-slate-900`} title={t.done} onClick={onClose}>
              <span className="material-icons text-[18px]">check</span>
              <span className="hidden sm:inline">{t.done}</span>
            </button>
          </div>

          {/* Pop-up panels rendered below the row (not clipped by the scroller). */}
          {menu === 'font' && (
            <div className="absolute left-1/2 -translate-x-1/2 top-full mt-2 w-[min(94vw,440px)] rounded-2xl border border-slate-200 bg-white shadow-2xl p-2 z-10">
              <div className="px-1.5 pb-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-400">{t.font}</div>
              <div className="max-h-[52vh] overflow-y-auto grid grid-cols-2 gap-1.5 overscroll-contain">
                {FONT_OPTIONS.map((f) => (
                  <button key={f.name} onClick={() => { onChange({ fontFamily: f.name }); setMenu(''); }}
                    className={`px-3 py-3 rounded-xl border text-[19px] leading-tight flex items-center justify-between gap-1 ${f.name === el.fontFamily ? 'bg-blue-50 border-blue-300 text-blue-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                    style={{ fontFamily: f.name }}>
                    <span className="truncate">{f.label}</span>
                    {f.name === el.fontFamily && <span className="material-icons text-[18px] shrink-0">check</span>}
                  </button>
                ))}
              </div>
            </div>
          )}
          {menu === 'size' && (
            <div className="absolute left-1/2 -translate-x-1/2 top-full mt-2 w-[min(92vw,320px)] rounded-2xl border border-slate-200 bg-white shadow-2xl p-2 z-10">
              <div className="px-1.5 pb-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-400">{t.size}</div>
              <div className="grid grid-cols-4 gap-1.5">
                {FONT_SIZE_PRESETS.map((s) => (
                  <button key={s} onClick={() => { onChange({ fontSize: s }); setMenu(''); }}
                    className={`h-11 rounded-xl border text-sm font-semibold tabular-nums ${s === curSize ? 'bg-blue-50 border-blue-300 text-blue-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}>{s}</button>
                ))}
              </div>
            </div>
          )}
          {menu === 'color' && (
            <div className="absolute left-1/2 -translate-x-1/2 top-full mt-2 w-[min(92vw,300px)] rounded-2xl border border-slate-200 bg-white shadow-2xl p-3 z-10">
              <div className="px-0.5 pb-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-400">{t.color}</div>
              <div className="grid grid-cols-5 gap-2">
                {TEXT_COLOR_PRESETS.map((c) => (
                  <button key={c} onClick={() => { onChange({ color: c }); setMenu(''); }}
                    className={`w-9 h-9 rounded-full border ${c === el.color ? 'ring-2 ring-blue-400 ring-offset-2' : 'border-slate-200'}`}
                    style={{ background: c }} aria-label={c} />
                ))}
              </div>
              <label className="mt-3 flex items-center gap-2 text-sm font-semibold text-slate-600 cursor-pointer">
                <input type="color" value={el.color} onChange={(e) => onChange({ color: e.target.value })} className="w-9 h-9 rounded-md cursor-pointer border-0 p-0" />
                {t.customColor}
              </label>
            </div>
          )}
        </div>
      </div>
    );
  }

  function App() {
    const browserLang = (navigator.language || 'ko').slice(0, 2);
    const [lang, setLang] = useState(i18n[browserLang] ? browserLang : 'ko');
    const t = i18n[lang];
    const languageOptions = [
      { value: 'ko', label: '한국어' },
      { value: 'en', label: 'English' },
      { value: 'ja', label: '日本語' }
    ];

    const [accessToken, setAccessToken] = useState(null);
    const [isApiLoaded, setIsApiLoaded] = useState(false);
    const [isGisLoaded, setIsGisLoaded] = useState(false);
    const [loadError, setLoadError] = useState('');

    const [loadedFileId, setLoadedFileId] = useState('');
    const [isLocalDoc, setIsLocalDoc] = useState(false); // true when the open document came from a local file (offline mode), not Google Drive
    const [padletInput, setPadletInput] = useState('');
    const [activePadlet, setActivePadlet] = useState('');
    const [embedMeta, setEmbedMeta] = useState({ type: '', url: '', fallbackUrl: '' });
    const [embedFailed, setEmbedFailed] = useState(false);
    const [canvaEmbedAttempt, setCanvaEmbedAttempt] = useState(false);
    const [historyTick, setHistoryTick] = useState(0);

    const [pdfDoc, setPdfDoc] = useState(null);
    const [currentPage, setCurrentPage] = useState(1);
    const [totalPages, setTotalPages] = useState(0);

    const [tool, setTool] = useState('pen');
    const [userZoom, setUserZoom] = useState(1);
    const [baseDims, setBaseDims] = useState({ w: 0, h: 0 });
    const [penColor, setPenColor] = useState('#000000');
    const [penWidth, setPenWidth] = useState(3);
    const [hlColor, setHlColor] = useState('#FDE047');
    const [toast, setToast] = useState('');

    // Text boxes & checkboxes placed on the page. Geometry is stored as fractions
    // (0..1) of the page so it survives zoom, resize and different devices.
    const [elements, setElements] = useState([]);
    const [selectedIds, setSelectedIds] = useState([]);
    const [creatingRect, setCreatingRect] = useState(null);
    const [marqueeRect, setMarqueeRect] = useState(null);
    const [isLoading, setIsLoading] = useState(false);
    const [isToolbarMinimized, setIsToolbarMinimized] = useState(false);
    const [isSharedView, setIsSharedView] = useState(() => new URLSearchParams(window.location.search).has('id'));
    const [allowStudentText, setAllowStudentText] = useState(() => new URLSearchParams(window.location.search).get('st') === '1');
    const canEdit = !isSharedView; // teachers (non-shared view) create/move/delete; students only fill
    // Students may author (create/move/resize/delete) text boxes only when the teacher
    // turned the option on for the shared link. Checkboxes stay teacher-only.
    const canAuthorText = canEdit || (isSharedView && allowStudentText);

    const [showHelpModal, setShowHelpModal] = useState(false);
    const [showSubmitLinkModal, setShowSubmitLinkModal] = useState(false);
    const [showShareModal, setShowShareModal] = useState(false);
    const [showMoreMenu, setShowMoreMenu] = useState(false);
    const [exportProgress, setExportProgress] = useState({ active: false, current: 0, total: 0 });
    const [authError, setAuthError] = useState('');

    const TOKEN_STORAGE_KEY = 'dp_google_token_v1';

    const pdfCanvasRef = useRef(null);
    const localFileInputRef = useRef(null);
    const drawCanvasRef = useRef(null);
    const containerRef = useRef(null);
    const moreMenuRef = useRef(null);
    const drawingsRef = useRef({});
    const historyRef = useRef({});
    const strokeRef = useRef(null);       // in-flight freehand stroke (points + base snapshot)
    const penRecentRef = useRef(-1e9);    // last stylus event time — palm rejection window
    const eraserCursorRef = useRef(null); // size-preview circle that follows the eraser
    const toastTimerRef = useRef(null);
    const scaleRef = useRef(1);
    const panState = useRef({ active: false, startX: 0, startY: 0, scrollLeft: 0, scrollTop: 0 });
    const pinchState = useRef({ active: false, initialDist: 0, initialZoom: 1 });
    const pageBoxRef = useRef(null);          // page-sized box used to convert pointer → fraction
    const pageMetaRef = useRef({});            // { [page]: { uw, uh } } unscaled PDF dimensions
    const dragRef = useRef(null);              // active move/resize gesture on a field
    const createRef = useRef(null);            // active drag-to-create gesture
    const marqueeRef = useRef(null);           // active marquee (drag-select) gesture

    useEffect(() => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      try {
        const stored = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.token && parsed.expiresAt && parsed.expiresAt > Date.now() + 60_000) {
            setAccessToken(parsed.token);
          } else {
            localStorage.removeItem(TOKEN_STORAGE_KEY);
          }
        }
      } catch (err) {
        console.warn('[DigitalPaper] token restore error', err);
      }

      const pollLimit = 60;
      let gapiTry = 0;
      let gisTry = 0;

      const pollGapi = () => {
        if (window.gapi && typeof window.gapi.load === 'function') {
          window.gapi.load('picker', {
            callback: () => setIsApiLoaded(true),
            onerror: () => {
              console.error('[DigitalPaper] gapi picker load error');
              setLoadError('구글 API 로딩 실패: 광고차단/네트워크를 확인 후 새로고침하세요.');
            },
            timeout: 10000,
            ontimeout: () => {
              console.error('[DigitalPaper] gapi picker load timeout');
              setLoadError('구글 API 로딩 시간 초과: 광고차단/네트워크를 확인하세요.');
            }
          });
          return;
        }
        gapiTry += 1;
        if (gapiTry >= pollLimit) {
          setLoadError('구글 API 스크립트를 불러오지 못했습니다. 광고차단 또는 네트워크 설정을 확인해주세요.');
          return;
        }
        setTimeout(pollGapi, 100);
      };

      const pollGis = () => {
        if (window.google && window.google.accounts && window.google.accounts.oauth2) {
          setIsGisLoaded(true);
          return;
        }
        gisTry += 1;
        if (gisTry >= pollLimit) {
          setLoadError(prev => prev || '구글 로그인 라이브러리를 불러오지 못했습니다. 광고차단 또는 네트워크를 확인해주세요.');
          return;
        }
        setTimeout(pollGis, 100);
      };

      pollGapi();
      pollGis();

      const qp = new URLSearchParams(window.location.search);
      const urlFileId = qp.get('id');
      const targetPage = parseInt(qp.get('s'), 10);
      const urlPadlet = qp.get('padlet');
      const urlElements = qp.get('el') ? deserializeElements(qp.get('el')) : [];

      if (urlPadlet) {
        const decodedPadlet = decodeURIComponent(urlPadlet);
        setPadletInput(decodedPadlet);
        setActivePadlet(decodedPadlet);
        setEmbedMeta(getEmbeddedUrl(decodedPadlet));
        setEmbedFailed(false);
        setCanvaEmbedAttempt(false);
      }
      setIsSharedView(Boolean(urlFileId));
      if (urlFileId) {
        if (urlElements.length) setTool('select'); // students land in fill mode
        loadPdfFromDriveAPI(urlFileId, targetPage || 1, urlPadlet ? decodeURIComponent(urlPadlet) : '', urlElements)
          .catch(err => console.error('[DigitalPaper] URL PDF load error', err));
      }
    }, []);

    const handleAuth = () => {
      if (!CLIENT_ID || !API_KEY) return alert('관리자가 API 설정을 완료해야 합니다.');
      if (!isGisLoaded) return alert('구글 로그인 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');

      try {
        const tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (response) => {
            if (response.error) {
              setAuthError(response.error_description || response.error || 'access_denied');
              return;
            }
            if (response.access_token) {
              setAuthError('');
              setAccessToken(response.access_token);
              const lifetimeMs = (parseInt(response.expires_in, 10) || 3600) * 1000;
              try {
                localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify({
                  token: response.access_token,
                  expiresAt: Date.now() + lifetimeMs
                }));
              } catch (storeErr) {
                console.warn('[DigitalPaper] token persist error', storeErr);
              }
            }
          }
        });
        tokenClient.requestAccessToken();
      } catch (err) {
        console.error('[DigitalPaper] auth error', err);
        setAuthError('로그인 처리 중 오류가 발생했습니다. 다시 시도해주세요.');
      }
    };

    useEffect(() => {
      if (!showMoreMenu) return;
      const onDocClick = (event) => {
        if (moreMenuRef.current && !moreMenuRef.current.contains(event.target)) {
          setShowMoreMenu(false);
        }
      };
      document.addEventListener('mousedown', onDocClick);
      document.addEventListener('touchstart', onDocClick);
      return () => {
        document.removeEventListener('mousedown', onDocClick);
        document.removeEventListener('touchstart', onDocClick);
      };
    }, [showMoreMenu]);

    const handleLogout = () => {
      const tokenToRevoke = accessToken;
      setAccessToken(null);
      setLoadedFileId('');
      setPdfDoc(null);
      setTotalPages(0);
      setCurrentPage(1);
      drawingsRef.current = {};
      historyRef.current = {};
      pageMetaRef.current = {};
      setElements([]);
      setSelectedIds([]);
      try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch (_) {}
      if (tokenToRevoke && window.google?.accounts?.oauth2?.revoke) {
        try { window.google.accounts.oauth2.revoke(tokenToRevoke, () => {}); } catch (_) {}
      }
    };

    const clearLoadedPdf = () => {
      setLoadedFileId('');
      setIsLocalDoc(false);
      setPdfDoc(null);
      setTotalPages(0);
      setCurrentPage(1);
      setUserZoom(1);
      drawingsRef.current = {};
      historyRef.current = {};
      pageMetaRef.current = {};
      setElements([]);
      setSelectedIds([]);
      setHistoryTick(prev => prev + 1);
    };

    const openPicker = () => {
      if (!CLIENT_ID || !API_KEY) return alert('API 미설정 상태입니다. 관리자에게 문의하세요.');
      if (!isApiLoaded) return;
      if (!accessToken) return handleAuth();

      try {
        const view = new window.google.picker.DocsView(window.google.picker.ViewId.DOCS)
          .setMode(window.google.picker.DocsViewMode.LIST)
          .setMimeTypes('application/pdf,image/png,image/jpeg');

        const pickerBuilder = new window.google.picker.PickerBuilder()
          .enableFeature(window.google.picker.Feature.NAV_HIDDEN)
          .setOAuthToken(accessToken)
          .setOrigin(window.location.protocol + '//' + window.location.host)
          .addView(view)
          .setDeveloperKey(API_KEY)
          .setCallback((data) => {
            if (data.action === window.google.picker.Action.PICKED) {
              const fileId = data.docs[0].id;
              loadPdfFromDriveAPI(fileId, 1, padletInput)
                .catch(err => console.error('[DigitalPaper] picker file load error', err));
            }
          });

        if (APP_ID) pickerBuilder.setAppId(APP_ID);

        pickerBuilder.build().setVisible(true);
      } catch (err) {
        console.error('[DigitalPaper] openPicker error', err);
        setLoadError('파일 선택기를 열지 못했습니다. 페이지를 새로고침해주세요.');
      }
    };

    // Shared reset step before swapping in a new document, regardless of source
    // (Google Drive fetch or a local file picked in offline mode).
    const resetDocState = (presetElements, padletUrl) => {
      setIsLoading(true);
      setPdfDoc(null);
      setUserZoom(1);
      drawingsRef.current = {};
      historyRef.current = {};
      pageMetaRef.current = {};
      setElements(presetElements || []);
      setSelectedIds([]);
      setHistoryTick(prev => prev + 1);
      setActivePadlet(padletUrl);
      setEmbedMeta(getEmbeddedUrl(padletUrl));
      setEmbedFailed(false);
      setCanvaEmbedAttempt(false);
    };

    // Parses a PDF/JPG/PNG ArrayBuffer (from Drive or a local file) and loads it
    // as the active document.
    const applyDocumentBuffer = async (arrayBuffer, fileId, targetPage) => {
      if (detectDocKind(arrayBuffer) === 'image') {
        const url = URL.createObjectURL(new Blob([arrayBuffer]));
        const img = await new Promise((resolve, reject) => {
          const im = new Image();
          im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
          im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 불러올 수 없습니다.')); };
          im.src = url;
        });
        setPdfDoc(makeImageDoc(img));
        setTotalPages(1);
        setCurrentPage(1);
        setLoadedFileId(fileId);
      } else {
        const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
        const doc = await loadingTask.promise.catch(err => {
          console.error('[DigitalPaper] PDF parse error', err);
          throw err;
        });
        setPdfDoc(doc);
        setTotalPages(doc.numPages);
        setCurrentPage(targetPage);
        setLoadedFileId(fileId);
      }
    };

    const loadPdfFromDriveAPI = async (fileId, targetPage = 1, padletUrl = padletInput, presetElements = null) => {
      if (!window.pdfjsLib) return;
      resetDocState(presetElements, padletUrl);
      setIsLocalDoc(false);

      try {
        const fetchUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
        const headers = accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
        const response = await fetch(fetchUrl, { headers }).catch(err => {
          console.error('[DigitalPaper] Drive fetch failed', err);
          throw err;
        });

        if (!response.ok) {
          if (response.status === 401) {
            setAccessToken(null);
            try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch (_) {}
            throw new Error('인증이 만료되었습니다. 다시 로그인 후 시도해주세요.');
          }
          if (response.status === 403 || response.status === 404) {
            throw new Error('파일에 접근할 수 없습니다. "링크가 있는 모든 사용자 보기" 권한을 확인해주세요.');
          }
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        await applyDocumentBuffer(arrayBuffer, fileId, targetPage);
      } catch (error) {
        console.error('[DigitalPaper] loadPdfFromDriveAPI error', error);
        alert('문서 로드 실패: ' + error.message);
        setLoadedFileId('');
      } finally {
        setIsLoading(false);
      }
    };

    // Offline mode: open a PDF/JPG/PNG straight from the user's device, with no
    // Google login or network access required. Editing, drawing and JPG/PDF
    // export all work exactly as with a Drive file; only the link-based [Share]
    // feature is unavailable, since there is no cloud copy for a shared URL to
    // point students at.
    const loadLocalFile = async (file) => {
      if (!file || !window.pdfjsLib) return;
      const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
      const isImage = file.type.startsWith('image/') || /\.(jpe?g|png)$/i.test(file.name);
      if (!isPdf && !isImage) { alert(t.localFileTypeError); return; }

      resetDocState(null, '');
      setIsLocalDoc(true);

      try {
        const arrayBuffer = await file.arrayBuffer();
        await applyDocumentBuffer(arrayBuffer, `local:${file.name}`, 1);
      } catch (error) {
        console.error('[DigitalPaper] loadLocalFile error', error);
        alert('문서 로드 실패: ' + error.message);
        setLoadedFileId('');
      } finally {
        setIsLoading(false);
      }
    };

    const handleZoom = (delta) => {
      setUserZoom(prev => delta === 0 ? 1 : Math.max(0.5, Math.min(4, prev + delta)));
    };

    const changePage = useCallback((delta) => {
      setSelectedIds([]);
      setCurrentPage(prev => {
        const newPage = prev + delta;
        if (newPage < 1 || newPage > totalPages) return prev;
        if (drawCanvasRef.current) drawingsRef.current[prev] = drawCanvasRef.current.toDataURL();
        return newPage;
      });
    }, [totalPages]);

    // Leaving select mode clears any field selection and in-progress creation.
    useEffect(() => {
      if (tool !== 'select') { setSelectedIds([]); setMarqueeRect(null); marqueeRef.current = null; }
      if (tool !== 'text' && tool !== 'checkbox') { setCreatingRect(null); createRef.current = null; }
    }, [tool]);

    useEffect(() => {
      if (!pdfDoc) return;
      let cancelled = false;
      const renderPage = async () => {
        const page = await pdfDoc.getPage(currentPage).catch(err => {
          console.error('[DigitalPaper] getPage error', err);
          throw err;
        });
        if (cancelled) return;
        const unscaledViewport = page.getViewport({ scale: 1 });
        pageMetaRef.current[currentPage] = { uw: unscaledViewport.width, uh: unscaledViewport.height };
        let baseScale = 1;

        if (containerRef.current) {
          // Reserve space for the bottom toolbar (~160px pb-40) and top pagination chip (~48px when present).
          const reserveTop = totalPages > 1 ? 48 : 0;
          const containerW = containerRef.current.clientWidth - 32;
          const containerH = containerRef.current.clientHeight - 160 - reserveTop;
          const fitW = containerW / unscaledViewport.width;
          const fitH = Math.max(120, containerH) / unscaledViewport.height;
          baseScale = Math.max(0.1, Math.min(fitW, fitH));
        }

        const devicePixelRatio = window.devicePixelRatio || 1;
        // Render at base scale × renderBoost so the bitmap still looks crisp
        // when the user zooms in via CSS transform. Lower on high-DPR devices
        // to keep memory in check on mobile.
        const renderBoost = devicePixelRatio >= 2 ? 1.25 : 1.75;
        const finalScale = baseScale * renderBoost;
        const viewport = page.getViewport({ scale: finalScale });
        scaleRef.current = devicePixelRatio * renderBoost;

        const pdfCanvas = pdfCanvasRef.current;
        const drawCanvas = drawCanvasRef.current;
        if (!pdfCanvas || !drawCanvas) return;

        const ctx = pdfCanvas.getContext('2d');
        const dCtx = drawCanvas.getContext('2d');

        const cssW = Math.floor(viewport.width / renderBoost);
        const cssH = Math.floor(viewport.height / renderBoost);

        [pdfCanvas, drawCanvas].forEach(canvas => {
          canvas.width = Math.floor(viewport.width * devicePixelRatio);
          canvas.height = Math.floor(viewport.height * devicePixelRatio);
          canvas.style.width = `${cssW}px`;
          canvas.style.height = `${cssH}px`;
        });

        setBaseDims({ w: cssW, h: cssH });

        dCtx.setTransform(1, 0, 0, 1, 0, 0);
        dCtx.scale(devicePixelRatio * renderBoost, devicePixelRatio * renderBoost);

        const renderContext = { canvasContext: ctx, transform: [devicePixelRatio, 0, 0, devicePixelRatio, 0, 0], viewport };
        await page.render(renderContext).promise.catch(err => {
          console.error('[DigitalPaper] render error', err);
          throw err;
        });
        if (cancelled) return;

        dCtx.clearRect(0, 0, cssW, cssH);
        const savedDataURL = drawingsRef.current[currentPage];
        if (savedDataURL) {
          const img = new Image();
          img.onload = () => { if (!cancelled) dCtx.drawImage(img, 0, 0, cssW, cssH); };
          img.src = savedDataURL;
        }
      };
      renderPage().catch(err => console.error('[DigitalPaper] renderPage chain error', err));
      return () => { cancelled = true; };
    }, [pdfDoc, currentPage]);

    // Desktop wheel: zoom when the pointer is over the document, scroll otherwise.
    // Attached natively with { passive: false } because React's synthetic onWheel is
    // passive and can't preventDefault to stop the page from scrolling while zooming.
    useEffect(() => {
      const container = containerRef.current;
      if (!container) return;
      const onWheel = (e) => {
        if (!pdfDoc) return;
        // Let a text field with overflowing content scroll itself instead of zooming.
        const ta = e.target;
        if (ta && ta.tagName === 'TEXTAREA' && ta.scrollHeight > ta.clientHeight + 1) return;
        const overDoc = pageBoxRef.current && pageBoxRef.current.contains(e.target);
        if (!overDoc && !(e.ctrlKey || e.metaKey)) return; // gray area scrolls normally
        e.preventDefault();
        handleZoom(e.deltaY < 0 ? 0.1 : -0.1);
      };
      container.addEventListener('wheel', onWheel, { passive: false });
      return () => container.removeEventListener('wheel', onWheel);
    }, [pdfDoc]);

    // Desktop keyboard shortcuts: undo/redo, delete selection, escape, page turn.
    useEffect(() => {
      const onKeyDown = (e) => {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        const typing = tag === 'TEXTAREA' || tag === 'INPUT';
        const mod = e.ctrlKey || e.metaKey;
        if (mod && !typing && (e.key === 'z' || e.key === 'Z')) {
          e.preventDefault();
          if (e.shiftKey) redoDrawing(); else undoDrawing();
        } else if (mod && !typing && (e.key === 'y' || e.key === 'Y')) {
          e.preventDefault();
          redoDrawing();
        } else if (!typing && (e.key === 'Delete' || e.key === 'Backspace')) {
          if (selectedIds.length) { e.preventDefault(); deleteSelected(); }
        } else if (e.key === 'Escape') {
          if (typing) document.activeElement.blur();
          setSelectedIds([]);
          if (tool !== 'select') setTool('select');
        } else if (!typing && e.key === 'ArrowLeft') {
          changePage(-1);
        } else if (!typing && e.key === 'ArrowRight') {
          changePage(1);
        }
      };
      window.addEventListener('keydown', onKeyDown);
      return () => window.removeEventListener('keydown', onKeyDown);
    }, [tool, selectedIds, currentPage, totalPages, changePage]);

    const showToast = (msg) => {
      setToast(msg);
      clearTimeout(toastTimerRef.current);
      toastTimerRef.current = setTimeout(() => setToast(''), 2400);
    };

    const ensureHistory = (pageNumber) => {
      if (!historyRef.current[pageNumber]) {
        historyRef.current[pageNumber] = { undo: [], redo: [] };
      }
      return historyRef.current[pageNumber];
    };

    const getCanvasSnapshot = () => {
      const canvas = drawCanvasRef.current;
      if (!canvas) return null;
      const data = canvas.toDataURL();
      return data;
    };

    const restoreCanvasSnapshot = (snapshot) => {
      const canvas = drawCanvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width / scaleRef.current;
      const height = canvas.height / scaleRef.current;
      ctx.clearRect(0, 0, width, height);
      if (!snapshot) {
        delete drawingsRef.current[currentPage];
        return;
      }
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, width, height);
        drawingsRef.current[currentPage] = snapshot;
      };
      img.src = snapshot;
    };

    const pushUndoSnapshot = () => {
      const history = ensureHistory(currentPage);
      history.undo.push(getCanvasSnapshot());
      if (history.undo.length > 60) history.undo.shift();
      history.redo = [];
      setHistoryTick(prev => prev + 1);
    };

    const getPointerPos = (clientX, clientY) => {
      const canvas = drawCanvasRef.current;
      const rect = canvas.getBoundingClientRect();
      const scaleX = (canvas.width / scaleRef.current) / rect.width;
      const scaleY = (canvas.height / scaleRef.current) / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    };

    // ── Freehand stroke engine ─────────────────────────────────────────────
    // Pointer-event based so stylus / mouse / finger share one code path. Points
    // (with pressure) are collected and the whole stroke is re-rendered each frame
    // on top of a snapshot taken at stroke start, which enables:
    //  • midpoint-quadratic smoothing (no polyline jaggies)
    //  • pressure (stylus) / velocity (mouse·finger) based variable width
    //  • uniform-alpha highlighter (no dark overlaps inside one stroke)
    //  • clean cancellation when a second finger turns the gesture into a pinch
    const STROKE_POS_SMOOTH = 0.55; // raw-input weight; lower = smoother but laggier
    const STROKE_MIN_DIST = 0.35;   // css px; drop sensor jitter below this
    const eraserWidth = () => Math.max(12, penWidth * 5);
    const highlighterWidth = () => Math.max(14, penWidth * 4);

    const strokeWidthFor = (s, dist, dt, pressure) => {
      if (s.tool !== 'pen') return s.baseWidth;
      if (s.pointerType === 'pen' && pressure > 0) {
        s.pEma = s.pEma == null ? pressure : s.pEma + (pressure - s.pEma) * 0.3;
        return s.baseWidth * (0.3 + s.pEma * 1.4);
      }
      const v = dt > 0 ? dist / dt : 0; // css px per ms
      s.vEma = s.vEma == null ? v : s.vEma + (v - s.vEma) * 0.2;
      return s.baseWidth * clamp(1.15 - s.vEma * 0.12, 0.72, 1.15);
    };

    const drawStrokePath = (ctx, s) => {
      const pts = s.points;
      if (!pts.length) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (s.tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = ctx.fillStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = ctx.fillStyle = s.color;
        if (s.tool === 'highlighter') ctx.globalAlpha = 0.4;
      }
      if (pts.length === 1) {
        ctx.beginPath();
        ctx.arc(pts[0].x, pts[0].y, pts[0].w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.tool === 'pen') {
        // Variable width: stroke each midpoint-quadratic segment with its own width.
        let m0 = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        ctx.beginPath();
        ctx.lineWidth = pts[0].w;
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(m0.x, m0.y);
        ctx.stroke();
        for (let i = 1; i < pts.length - 1; i++) {
          const m1 = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
          ctx.beginPath();
          ctx.lineWidth = pts[i].w;
          ctx.moveTo(m0.x, m0.y);
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, m1.x, m1.y);
          ctx.stroke();
          m0 = m1;
        }
        const last = pts[pts.length - 1];
        ctx.beginPath();
        ctx.lineWidth = last.w;
        ctx.moveTo(m0.x, m0.y);
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
      } else {
        // Constant width (highlighter / eraser): one smooth path, one stroke call.
        ctx.lineWidth = pts[0].w;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length - 1; i++) {
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
        }
        const last = pts[pts.length - 1];
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
      }
      ctx.restore();
    };

    const restoreStrokeBase = (s) => {
      const canvas = drawCanvasRef.current;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(s.base, 0, 0);
      ctx.restore();
    };

    const renderStrokeFrame = () => {
      const s = strokeRef.current;
      if (!s || !drawCanvasRef.current) return;
      s.raf = 0;
      restoreStrokeBase(s);
      drawStrokePath(drawCanvasRef.current.getContext('2d'), s);
      // Bake very long strokes into the base so the per-frame redraw stays cheap.
      if (s.points.length > 1500) {
        const bctx = s.base.getContext('2d');
        bctx.clearRect(0, 0, s.base.width, s.base.height);
        bctx.drawImage(drawCanvasRef.current, 0, 0);
        s.points = s.points.slice(-2);
      }
    };

    const scheduleStrokeRender = () => {
      const s = strokeRef.current;
      if (s && !s.raf) s.raf = requestAnimationFrame(renderStrokeFrame);
    };

    const appendStrokePoints = (e, final = false) => {
      const s = strokeRef.current;
      if (!s || e.pointerId !== s.pointerId) return;
      const native = e.nativeEvent || e;
      let list = (!final && native.getCoalescedEvents) ? native.getCoalescedEvents() : null;
      if (!list || !list.length) list = [e];
      for (const ev of list) {
        const pos = getPointerPos(ev.clientX, ev.clientY);
        const prev = s.points[s.points.length - 1];
        let x = pos.x, y = pos.y;
        if (prev && !final) {
          x = prev.x + (x - prev.x) * STROKE_POS_SMOOTH;
          y = prev.y + (y - prev.y) * STROKE_POS_SMOOTH;
        }
        if (prev) {
          const dist = Math.hypot(x - prev.x, y - prev.y);
          if (!final && dist < STROKE_MIN_DIST) continue;
          const ts = ev.timeStamp || e.timeStamp;
          const dt = Math.max(1, ts - s.lastT);
          s.lastT = ts;
          s.points.push({ x, y, w: strokeWidthFor(s, dist, dt, ev.pressure) });
        } else {
          s.points.push({ x, y, w: strokeWidthFor(s, 0, 0, ev.pressure) });
        }
      }
      scheduleStrokeRender();
    };

    const beginStroke = (e) => {
      if (strokeRef.current || !drawCanvasRef.current) return;
      if (e.pointerType === 'touch') {
        if (pinchState.current.active) return;
        // Palm rejection: ignore finger input while / shortly after the stylus is in use.
        if (e.timeStamp - penRecentRef.current < 2500) return;
      }
      pushUndoSnapshot();
      const canvas = drawCanvasRef.current;
      const base = document.createElement('canvas');
      base.width = canvas.width;
      base.height = canvas.height;
      base.getContext('2d').drawImage(canvas, 0, 0);
      const baseWidth = tool === 'eraser' ? eraserWidth() : tool === 'highlighter' ? highlighterWidth() : penWidth;
      strokeRef.current = {
        pointerId: e.pointerId, pointerType: e.pointerType, tool,
        color: tool === 'highlighter' ? hlColor : penColor,
        baseWidth, base, points: [], raf: 0, pEma: null, vEma: null, lastT: e.timeStamp
      };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      appendStrokePoints(e);
    };

    const endStroke = (e) => {
      const s = strokeRef.current;
      if (!s || (e && e.pointerId !== s.pointerId)) return;
      if (e && e.clientX != null) appendStrokePoints(e, true);
      if (s.raf) { cancelAnimationFrame(s.raf); s.raf = 0; }
      renderStrokeFrame();
      strokeRef.current = null;
      drawingsRef.current[currentPage] = getCanvasSnapshot();
      setHistoryTick(prev => prev + 1);
    };

    // Abort the in-flight stroke and roll back its undo entry — used when a second
    // finger turns the gesture into a pinch zoom, so no stray mark is left behind.
    const cancelActiveStroke = () => {
      const s = strokeRef.current;
      if (!s) return;
      if (s.raf) { cancelAnimationFrame(s.raf); s.raf = 0; }
      restoreStrokeBase(s);
      strokeRef.current = null;
      const history = ensureHistory(currentPage);
      history.undo.pop();
      setHistoryTick(prev => prev + 1);
    };

    const updateEraserCursor = (e) => {
      const el = eraserCursorRef.current;
      if (!el) return;
      const pos = getPointerPos(e.clientX, e.clientY);
      const d = eraserWidth();
      el.style.display = 'block';
      el.style.width = el.style.height = `${d}px`;
      el.style.left = `${pos.x - d / 2}px`;
      el.style.top = `${pos.y - d / 2}px`;
    };
    const hideEraserCursor = () => {
      if (eraserCursorRef.current) eraserCursorRef.current.style.display = 'none';
    };

    const startPan = (clientX, clientY) => {
      if (tool !== 'pan' || !containerRef.current) return;
      panState.current = {
        active: true,
        startX: clientX,
        startY: clientY,
        scrollLeft: containerRef.current.scrollLeft,
        scrollTop: containerRef.current.scrollTop
      };
    };

    const movePan = (clientX, clientY) => {
      if (!panState.current.active || !containerRef.current) return;
      const dx = clientX - panState.current.startX;
      const dy = clientY - panState.current.startY;
      containerRef.current.scrollLeft = panState.current.scrollLeft - dx;
      containerRef.current.scrollTop = panState.current.scrollTop - dy;
    };

    const endPan = () => {
      panState.current.active = false;
    };

    // ── Field (text box / checkbox) helpers ────────────────────────────────
    // Convert a client point to a fraction (0..1) of the current page box.
    const getFrac = (clientX, clientY) => {
      const box = pageBoxRef.current;
      if (!box) return { x: 0, y: 0 };
      const rect = box.getBoundingClientRect();
      if (!rect.width || !rect.height) return { x: 0, y: 0 };
      return { x: clamp((clientX - rect.left) / rect.width, 0, 1), y: clamp((clientY - rect.top) / rect.height, 0, 1) };
    };

    const addElement = (el) => setElements(prev => [...prev, el]);
    const updateElement = (id, patch) => setElements(prev => prev.map(el => (el.id === id ? { ...el, ...patch } : el)));
    const removeElement = (id) => { setElements(prev => prev.filter(el => el.id !== id)); setSelectedIds(prev => prev.filter(x => x !== id)); };
    const removeElements = (ids) => { const set = new Set(ids); setElements(prev => prev.filter(el => !set.has(el.id))); setSelectedIds([]); };

    const DEFAULT_FONT_SIZE = 16;
    const addTextBox = (x, y, w, h) => {
      const fw = clamp(w, 0.08, 1);
      const fh = clamp(h, 0.04, 1);
      const id = genId('t');
      addElement({ id, page: currentPage, type: 'text', x: clamp(x, 0, 1 - fw), y: clamp(y, 0, 1 - fh), w: fw, h: fh, text: '', fontFamily: FONT_OPTIONS[0].name, fontSize: DEFAULT_FONT_SIZE, color: DEFAULT_TEXT_COLOR, bold: false, align: 'left' });
      setTool('select');
      setSelectedIds([id]);
      setTimeout(() => { const ta = document.getElementById('ta-' + id); if (ta) ta.focus(); }, 60);
    };

    const addCheckboxAt = (cx, cy) => {
      const meta = pageMetaRef.current[currentPage] || { uw: 600, uh: 800 };
      const wFrac = 0.05;
      const hFrac = wFrac * ((meta.uw || 1) / (meta.uh || 1)); // square in pixels
      const id = genId('c');
      addElement({ id, page: currentPage, type: 'checkbox', x: clamp(cx - wFrac / 2, 0, 1 - wFrac), y: clamp(cy - hFrac / 2, 0, 1 - hFrac), w: wFrac, h: hFrac, checked: false });
    };

    // In checkbox-create mode, clicking an existing checkbox removes it.
    const checkboxAtPoint = (px, py) => {
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        if (el.type === 'checkbox' && el.page === currentPage && px >= el.x && px <= el.x + el.w && py >= el.y && py <= el.y + el.h) return el;
      }
      return null;
    };

    // Move / resize a selected field. Text boxes follow canAuthorText (teacher, or
    // student when allowed); checkboxes stay teacher-only. Pointer events so mouse
    // and touch share one path.
    const beginElementDrag = (e, el, mode) => {
      if (el.type === 'checkbox' ? !canEdit : !canAuthorText) return;
      e.preventDefault();
      e.stopPropagation();
      const start = getFrac(e.clientX, e.clientY);
      dragRef.current = { id: el.id, mode, startX: start.x, startY: start.y, el: { ...el } };
      const onMove = (ev) => {
        const d = dragRef.current;
        if (!d) return;
        const p = getFrac(ev.clientX, ev.clientY);
        if (d.mode === 'move') {
          const nx = clamp(d.el.x + (p.x - d.startX), 0, 1 - d.el.w);
          const ny = clamp(d.el.y + (p.y - d.startY), 0, 1 - d.el.h);
          updateElement(d.id, { x: nx, y: ny });
        } else {
          let nw = clamp(d.el.w + (p.x - d.startX), 0.04, 1 - d.el.x);
          let nh;
          if (d.el.type === 'checkbox') {
            const meta = pageMetaRef.current[d.el.page] || { uw: 1, uh: 1 };
            nh = nw * ((meta.uw || 1) / (meta.uh || 1));
            if (d.el.y + nh > 1) { nh = 1 - d.el.y; nw = nh * ((meta.uh || 1) / (meta.uw || 1)); }
          } else {
            nh = clamp(d.el.h + (p.y - d.startY), 0.03, 1 - d.el.y);
          }
          updateElement(d.id, { w: nw, h: nh });
        }
      };
      const onUp = () => {
        dragRef.current = null;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };

    // Drag-to-create (text) / click-to-place (checkbox) on the create overlay.
    const handleCreatePointerDown = (e) => {
      e.preventDefault();
      const p = getFrac(e.clientX, e.clientY);
      if (tool === 'checkbox') {
        const hit = checkboxAtPoint(p.x, p.y);
        if (hit) removeElement(hit.id);   // click an existing checkbox again to remove it
        else addCheckboxAt(p.x, p.y);
        return;
      }
      createRef.current = { sx: p.x, sy: p.y, rect: { x: p.x, y: p.y, w: 0, h: 0 } };
      setCreatingRect({ x: p.x, y: p.y, w: 0, h: 0 });
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const handleCreatePointerMove = (e) => {
      if (!createRef.current) return;
      const p = getFrac(e.clientX, e.clientY);
      const { sx, sy } = createRef.current;
      const rect = { x: Math.min(sx, p.x), y: Math.min(sy, p.y), w: Math.abs(p.x - sx), h: Math.abs(p.y - sy) };
      createRef.current.rect = rect;
      setCreatingRect(rect);
    };
    const handleCreatePointerUp = () => {
      const data = createRef.current;
      createRef.current = null;
      setCreatingRect(null);
      if (!data) return;
      const r = data.rect;
      if (r && r.w > 0.03 && r.h > 0.02) addTextBox(r.x, r.y, r.w, r.h);
      else addTextBox(clamp(data.sx - 0.15, 0, 0.7), clamp(data.sy - 0.03, 0, 0.92), 0.3, 0.07);
    };

    // Marquee (drag-select) on empty page area — teacher only. A plain click clears.
    const beginMarquee = (e) => {
      const start = getFrac(e.clientX, e.clientY);
      marqueeRef.current = { sx: start.x, sy: start.y, rect: { x: start.x, y: start.y, w: 0, h: 0 } };
      setMarqueeRect({ x: start.x, y: start.y, w: 0, h: 0 });
      const onMove = (ev) => {
        const m = marqueeRef.current;
        if (!m) return;
        const p = getFrac(ev.clientX, ev.clientY);
        const rect = { x: Math.min(m.sx, p.x), y: Math.min(m.sy, p.y), w: Math.abs(p.x - m.sx), h: Math.abs(p.y - m.sy) };
        m.rect = rect;
        setMarqueeRect(rect);
      };
      const onUp = () => {
        const m = marqueeRef.current;
        marqueeRef.current = null;
        setMarqueeRect(null);
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        if (!m) return;
        const r = m.rect;
        if (r.w < 0.012 && r.h < 0.012) { setSelectedIds([]); return; }
        const ids = elements.filter(el => el.page === currentPage && !(el.x + el.w < r.x || el.x > r.x + r.w || el.y + el.h < r.y || el.y > r.y + r.h)).map(el => el.id);
        setSelectedIds(ids);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };

    // Move every selected field together (teacher). Delta is clamped by the group bbox.
    const beginGroupDrag = (e) => {
      if (!canEdit) return;
      e.preventDefault();
      e.stopPropagation();
      const start = getFrac(e.clientX, e.clientY);
      const sel = elements.filter(el => selectedIds.includes(el.id) && el.page === currentPage).map(el => ({ id: el.id, x: el.x, y: el.y, w: el.w, h: el.h }));
      if (!sel.length) return;
      const minX = Math.min(...sel.map(s => s.x));
      const minY = Math.min(...sel.map(s => s.y));
      const maxX = Math.max(...sel.map(s => s.x + s.w));
      const maxY = Math.max(...sel.map(s => s.y + s.h));
      const ids = new Set(sel.map(s => s.id));
      const onMove = (ev) => {
        const p = getFrac(ev.clientX, ev.clientY);
        const dx = clamp(p.x - start.x, -minX, 1 - maxX);
        const dy = clamp(p.y - start.y, -minY, 1 - maxY);
        setElements(prev => prev.map(el => {
          if (!ids.has(el.id)) return el;
          const s = sel.find(o => o.id === el.id);
          return { ...el, x: s.x + dx, y: s.y + dy };
        }));
      };
      const onUp = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };

    const deleteSelected = () => { if (selectedIds.length) removeElements(selectedIds); };

    // Two-finger pinch zoom, centralized on the scroll container so it works in
    // every tool mode (the draw canvas only handles single-finger gestures).
    const handleContainerTouchStart = (e) => {
      if (e.touches && e.touches.length >= 2) {
        const s = strokeRef.current;
        if (s && s.pointerType === 'pen') return; // palm landed while writing with a stylus — keep the stroke
        if (s) cancelActiveStroke();              // finger stroke becomes a pinch — drop the stray mark
        pinchState.current = { active: true, initialDist: getTouchDistance(e.touches), initialZoom: userZoom };
      }
    };
    const handleContainerTouchMove = (e) => {
      if (pinchState.current.active && e.touches && e.touches.length >= 2) {
        e.preventDefault();
        const newDist = getTouchDistance(e.touches);
        if (!pinchState.current.initialDist) return;
        const ratio = newDist / pinchState.current.initialDist;
        setUserZoom(clamp(pinchState.current.initialZoom * ratio, 0.5, 4));
      }
    };
    const handleContainerTouchEnd = (e) => {
      if (pinchState.current.active && (!e.touches || e.touches.length < 2)) pinchState.current.active = false;
    };

    const getTouchDistance = (touches) => {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    };

    // Unified pointer handlers for the draw canvas (stylus / mouse / finger).
    const handleDrawPointerDown = (e) => {
      if (e.pointerType === 'pen') penRecentRef.current = e.timeStamp;
      if (tool === 'pan') {
        e.preventDefault();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        startPan(e.clientX, e.clientY);
        return;
      }
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      beginStroke(e);
    };

    const handleDrawPointerMove = (e) => {
      if (e.pointerType === 'pen') penRecentRef.current = e.timeStamp;
      if (tool === 'eraser') updateEraserCursor(e);
      if (tool === 'pan') {
        movePan(e.clientX, e.clientY);
        return;
      }
      appendStrokePoints(e);
    };

    const handleDrawPointerUp = (e) => {
      if (tool === 'pan') { endPan(); return; }
      endStroke(e);
    };

    const handleDrawPointerCancel = () => {
      if (tool === 'pan') { endPan(); return; }
      cancelActiveStroke();
    };

    const handleApplySubmissionLink = () => {
      const trimmed = padletInput.trim();
      if (!trimmed) {
        setActivePadlet('');
        setEmbedMeta({ type: '', url: '', fallbackUrl: '' });
        setEmbedFailed(false);
        setCanvaEmbedAttempt(false);
        return;
      }
      const resolved = getEmbeddedUrl(trimmed);
      setActivePadlet(trimmed);
      setEmbedMeta(resolved);
      setEmbedFailed(false);
      setCanvaEmbedAttempt(false);
    };

    const handleShare = () => {
      if (!loadedFileId) return alert(t.shareError);
      if (isLocalDoc) return alert(t.localShareError);
      const currentUrl = new URL(window.location.href);
      currentUrl.searchParams.set('id', loadedFileId);
      currentUrl.searchParams.set('s', currentPage.toString());
      const encodedEls = serializeElements(elements);
      if (encodedEls) currentUrl.searchParams.set('el', encodedEls);
      else currentUrl.searchParams.delete('el');
      if (allowStudentText) currentUrl.searchParams.set('st', '1');
      else currentUrl.searchParams.delete('st');
      if (padletInput.trim()) {
        currentUrl.searchParams.set('padlet', encodeURIComponent(padletInput.trim()));
        setActivePadlet(padletInput.trim());
        setEmbedMeta(getEmbeddedUrl(padletInput.trim()));
        setEmbedFailed(false);
        setCanvaEmbedAttempt(false);
      } else {
        currentUrl.searchParams.delete('padlet');
      }
      navigator.clipboard.writeText(currentUrl.toString())
        .then(() => showToast(t.shareSuccess))
        .catch((err) => console.error('[DigitalPaper] share copy error', err));
    };

    const clearCanvas = () => {
      if (!window.confirm(t.clearConfirm)) return;
      const canvas = drawCanvasRef.current;
      if (canvas) {
        pushUndoSnapshot();
        canvas.getContext('2d').clearRect(0, 0, canvas.width / scaleRef.current, canvas.height / scaleRef.current);
        delete drawingsRef.current[currentPage];
      }
      // Also remove the text boxes & checkboxes placed on this page.
      setElements(prev => prev.filter(el => el.page !== currentPage));
      setSelectedIds([]);
    };

    const undoDrawing = () => {
      const history = ensureHistory(currentPage);
      if (!history.undo.length) return;
      history.redo.push(getCanvasSnapshot());
      const previous = history.undo.pop();
      restoreCanvasSnapshot(previous);
      setHistoryTick(prev => prev + 1);
    };

    const redoDrawing = () => {
      const history = ensureHistory(currentPage);
      if (!history.redo.length) return;
      history.undo.push(getCanvasSnapshot());
      const next = history.redo.pop();
      restoreCanvasSnapshot(next);
      setHistoryTick(prev => prev + 1);
    };

    const exportAsJpg = async () => {
      const bgCanvas = pdfCanvasRef.current;
      const fgCanvas = drawCanvasRef.current;
      if (!bgCanvas || !fgCanvas) return;
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = bgCanvas.width;
      exportCanvas.height = bgCanvas.height;
      const ctx = exportCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      ctx.drawImage(bgCanvas, 0, 0);
      ctx.drawImage(fgCanvas, 0, 0);
      const pageEls = elements.filter(el => el.page === currentPage);
      if (pageEls.length) {
        await ensureFontsLoaded(pageEls);
        const meta = pageMetaRef.current[currentPage];
        const ptToPx = (meta && meta.uh) ? (exportCanvas.height / meta.uh) : 1;
        renderElementsOnCanvas(ctx, pageEls, exportCanvas.width, exportCanvas.height, ptToPx);
      }
      const link = document.createElement('a');
      link.download = `digital-paper-page${currentPage}.jpg`;
      link.href = exportCanvas.toDataURL('image/jpeg', 0.9);
      link.click();
    };

    const drawAnnotationOnto = (ctx, snapshot, width, height) => new Promise((resolve) => {
      if (!snapshot) { resolve(); return; }
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, width, height); resolve(); };
      img.onerror = () => resolve();
      img.src = snapshot;
    });

    const exportAsPdf = async () => {
      if (!pdfDoc || !window.jspdf || !window.jspdf.jsPDF) return;

      if (drawCanvasRef.current) {
        drawingsRef.current[currentPage] = drawCanvasRef.current.toDataURL();
      }

      setIsLoading(true);
      setExportProgress({ active: true, current: 0, total: totalPages });

      try {
        const exportScale = 2;
        let pdf = null;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          setExportProgress({ active: true, current: pageNum, total: totalPages });

          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: exportScale });
          const pageCanvas = document.createElement('canvas');
          pageCanvas.width = Math.floor(viewport.width);
          pageCanvas.height = Math.floor(viewport.height);
          const pageCtx = pageCanvas.getContext('2d');
          pageCtx.fillStyle = '#ffffff';
          pageCtx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);

          await page.render({ canvasContext: pageCtx, viewport }).promise;

          await drawAnnotationOnto(pageCtx, drawingsRef.current[pageNum], pageCanvas.width, pageCanvas.height);

          const pageEls = elements.filter(el => el.page === pageNum);
          if (pageEls.length) {
            await ensureFontsLoaded(pageEls);
            renderElementsOnCanvas(pageCtx, pageEls, pageCanvas.width, pageCanvas.height, exportScale);
          }

          const orientation = pageCanvas.width > pageCanvas.height ? 'landscape' : 'portrait';
          const imgData = pageCanvas.toDataURL('image/jpeg', 0.9);

          if (!pdf) {
            pdf = new window.jspdf.jsPDF({ orientation, unit: 'px', format: [pageCanvas.width, pageCanvas.height] });
          } else {
            pdf.addPage([pageCanvas.width, pageCanvas.height], orientation);
          }
          pdf.addImage(imgData, 'JPEG', 0, 0, pageCanvas.width, pageCanvas.height);
        }

        const filename = totalPages > 1 ? 'digital-paper.pdf' : `digital-paper-page${currentPage}.pdf`;
        pdf.save(filename);
      } catch (err) {
        console.error('[DigitalPaper] PDF export error', err);
        alert('PDF 저장 실패: ' + (err && err.message ? err.message : err));
      } finally {
        setExportProgress({ active: false, current: 0, total: 0 });
        setIsLoading(false);
      }
    };


    const getEmbeddedUrl = (rawUrl) => {
      if (!rawUrl) return { type: '', url: '', fallbackUrl: '' };
      let normalized = rawUrl.trim();
      if (!/^https?:\/\//i.test(normalized)) normalized = `https://${normalized}`;

      try {
        const url = new URL(normalized);
        const host = url.hostname.replace(/^www\./, '');

        if (host.includes('canva.com') || host.includes('canva.link')) {
          let embedUrl = url.toString();

          if (host.includes('canva.com') && url.pathname.includes('/design/')) {
            embedUrl = url.toString().replace('/edit', '/view');
            const embedParsed = new URL(embedUrl);
            embedParsed.searchParams.set('embed', '1');
            embedUrl = embedParsed.toString();
          }

          return { type: 'canva', url: embedUrl, fallbackUrl: url.toString() };
        }

        if (host.includes('padlet.com') || host.includes('thinkerbell.co.kr') || host.includes('thinkerbell.com')) {
          return { type: 'iframe', url: url.toString(), fallbackUrl: url.toString() };
        }

        return { type: 'iframe', url: url.toString(), fallbackUrl: url.toString() };
      } catch (error) {
        return { type: 'invalid', url: normalized, fallbackUrl: normalized };
      }
    };

    const pageHistory = historyRef.current[currentPage] || { undo: [], redo: [] };
    const canUndo = pageHistory.undo.length > 0;
    const canRedo = pageHistory.redo.length > 0;

    // Field rendering helpers (depend on the current page's render scale).
    const curMeta = pageMetaRef.current[currentPage];
    const baseScale = (curMeta && curMeta.uh && baseDims.h) ? (baseDims.h / curMeta.uh) : 1;
    const pageElements = elements.filter(el => el.page === currentPage);
    const selectedEls = pageElements.filter(el => selectedIds.includes(el.id));
    const selectedEl = selectedEls.length === 1 ? selectedEls[0] : null; // single selection
    const groupBBox = (tool === 'select' && canEdit && selectedEls.length > 1)
      ? {
          x: Math.min(...selectedEls.map(s => s.x)),
          y: Math.min(...selectedEls.map(s => s.y)),
          x2: Math.max(...selectedEls.map(s => s.x + s.w)),
          y2: Math.max(...selectedEls.map(s => s.y + s.h)),
        }
      : null;
    const drawActive = tool === 'pen' || tool === 'highlighter' || tool === 'eraser' || tool === 'pan';
    const showCreateOverlay = (tool === 'text' && canAuthorText) || (tool === 'checkbox' && canEdit);
    const toggleCheckbox = (el) => {
      if (canEdit) {
        if (!(selectedIds.length === 1 && selectedIds[0] === el.id)) { setSelectedIds([el.id]); return; }
        updateElement(el.id, { checked: !el.checked });
      } else {
        updateElement(el.id, { checked: !el.checked });
      }
    };

    return (
      <div className="flex flex-col h-[100dvh] overflow-hidden bg-warm text-gray-700">
        <header className="bg-white/90 backdrop-blur-md border-b border-pink-100 px-3 sm:px-6 py-2 flex flex-col gap-1 shadow-[0_4px_20px_-6px_rgba(99,102,241,0.15)] z-20 shrink-0">
          <div className="flex items-center gap-1.5 sm:gap-2 min-w-0">
            <span className="material-icons text-pastelBlueText text-xl sm:text-2xl shrink-0">edit_document</span>
            <button onClick={() => window.location.reload()} className="text-[14px] sm:text-[18px] leading-tight font-bold tracking-[-0.02em] text-gray-900 mr-auto min-w-0 truncate text-left hover:text-blue-700 transition-colors">{t.title}</button>
            {!isSharedView && (
              <>
                <input
                  type="file"
                  ref={localFileInputRef}
                  accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png"
                  className="hidden"
                  onChange={(e) => {
                    const file = e.target.files && e.target.files[0];
                    if (file) loadLocalFile(file);
                    e.target.value = '';
                  }}
                />
                <button onClick={() => localFileInputRef.current && localFileInputRef.current.click()} title={t.openLocalHint} className="h-9 w-9 sm:h-10 sm:w-auto sm:px-3 rounded-xl bg-[#7C3AED] hover:bg-[#6D28D9] text-white border border-[#6D28D9] flex items-center justify-center gap-1.5 shrink-0 transition-all hover:-translate-y-0.5 hover:shadow-md">
                  <span className="material-icons text-base">upload_file</span>
                  <span className="hidden sm:inline text-sm font-semibold whitespace-nowrap">{t.openLocal}</span>
                </button>
              </>
            )}
            {!isSharedView && (!accessToken ? (
              <button onClick={handleAuth} disabled={!isGisLoaded} className="h-9 w-9 sm:h-10 sm:w-auto sm:px-3 rounded-xl bg-[#1D4ED8] hover:bg-[#1E40AF] text-white border border-[#1E40AF] disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-1.5 shrink-0 transition-all hover:-translate-y-0.5 hover:shadow-md">
                <GoogleIcon />
                <span className="hidden sm:inline text-sm font-semibold whitespace-nowrap">{t.login}</span>
              </button>
            ) : (
              <button onClick={openPicker} disabled={!isApiLoaded} className="h-9 w-9 sm:h-10 sm:w-auto sm:px-3 rounded-xl bg-[#047857] hover:bg-[#065F46] text-white border border-[#065F46] disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-1.5 shrink-0 transition-all hover:-translate-y-0.5 hover:shadow-md">
                <span className="material-icons text-base">folder_open</span>
                <span className="hidden sm:inline text-sm font-semibold whitespace-nowrap">{t.select}</span>
              </button>
            ))}
            {!isSharedView && loadedFileId && (
