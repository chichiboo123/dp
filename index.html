                      <button onClick={undoDrawing} disabled={!canUndo} className="h-9 w-9 sm:h-11 sm:w-11 rounded-xl border border-gray-200 bg-white text-gray-700 disabled:opacity-35 flex items-center justify-center shrink-0" title={t.undo}><span className="material-icons text-[18px] sm:text-[20px]">undo</span></button>
                      <button onClick={redoDrawing} disabled={!canRedo} className="h-9 w-9 sm:h-11 sm:w-11 rounded-xl border border-gray-200 bg-white text-gray-700 disabled:opacity-35 flex items-center justify-center shrink-0" title={t.redo}><span className="material-icons text-[18px] sm:text-[20px]">redo</span></button>
                      <button onClick={clearCanvas} className="h-9 w-9 sm:h-11 sm:w-11 rounded-xl border border-gray-200 bg-white text-gray-500 flex items-center justify-center shrink-0" title={t.clear}><span className="material-icons text-[18px] sm:text-[20px]">restart_alt</span></button>
                      <div className="w-px h-6 bg-slate-200 shrink-0 mx-0.5"/>
                      <button onClick={exportAsJpg} title={t.exportJpg} className="h-9 w-9 sm:h-11 sm:w-auto sm:px-2.5 rounded-xl border border-[#FDBA74] bg-[#FFF7ED] text-[#9A3412] font-semibold flex items-center justify-center gap-1 shrink-0">
                        <span className="material-icons text-[18px]">image</span>
                        <span className="hidden sm:inline text-xs">JPG</span>
                      </button>
                      <button onClick={exportAsPdf} title={t.exportPdf} className="h-9 w-9 sm:h-11 sm:w-auto sm:px-2.5 rounded-xl border border-[#86EFAC] bg-[#ECFDF5] text-[#166534] font-semibold flex items-center justify-center gap-1 shrink-0">
                        <span className="material-icons text-[18px]">picture_as_pdf</span>
                        <span className="hidden sm:inline text-xs">PDF</span>
                      </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="fixed right-2 sm:right-3 bottom-[64px] sm:bottom-8 z-40">
                <div className="rounded-2xl border border-slate-200 bg-white/95 backdrop-blur-md shadow-xl px-1.5 sm:px-2 py-1.5 sm:py-2 flex flex-col items-center gap-1.5 sm:gap-2">
                  <button onClick={() => handleZoom(0.1)} title="Zoom in" className="h-9 w-9 sm:h-11 sm:w-11 rounded-xl border border-gray-200 text-lg sm:text-xl font-bold text-gray-700 hover:bg-gray-50 flex items-center justify-center">+</button>
                  <button onClick={() => handleZoom(-0.1)} title="Zoom out" className="h-9 w-9 sm:h-11 sm:w-11 rounded-xl border border-gray-200 text-lg sm:text-xl font-bold text-gray-700 hover:bg-gray-50 flex items-center justify-center">-</button>
                  <button onClick={() => handleZoom(0)} title={t.fit} className="h-8 sm:h-9 min-w-[44px] sm:min-w-[52px] px-1.5 sm:px-2 rounded-xl border border-indigo-200 text-[11px] sm:text-xs font-bold text-indigo-700 bg-indigo-50">{Math.round(userZoom * 100)}%</button>
                </div>
              </div>

            </>
          )}

          {toast && (
            <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[90] rounded-full bg-slate-900/90 text-white text-sm font-semibold px-5 py-2.5 shadow-xl pointer-events-none">
              {toast}
            </div>
          )}
        </main>

        <footer className="bg-white/90 border-t border-pink-100 py-2 text-center shrink-0 z-10">
          <a href="https://litt.ly/chichiboo" target="_blank" rel="noopener noreferrer" className="text-gray-500 hover:text-pastelBlueText text-xs font-medium transition-colors inline-block">Created by. 교육뮤지컬 꿈꾸는 치수쌤</a>
        </footer>

        {showHelpModal && (
          <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-hidden">
              <div className="bg-gradient-to-r from-blue-100 to-pink-100 border-b border-blue-100 px-6 py-4 flex items-center justify-between shrink-0">
                <h2 className="text-[18px] font-bold text-gray-800 flex items-center gap-2"><span className="material-icons">lightbulb</span>{t.helpTitle}</h2>
                <button onClick={() => setShowHelpModal(false)} className="text-gray-400 hover:text-gray-700 transition-colors p-1"><span className="material-icons">close</span></button>
              </div>

              <div className="p-6 overflow-y-auto space-y-8 flex-1 text-[15px]">
                <section>
                  <h3 className="text-[18px] font-bold text-pastelBlueText bg-blue-100/50 px-3 py-1.5 rounded-md inline-flex items-center gap-2 mb-3"><span className="material-icons">school</span>{t.teacherGuide}</h3>
                  <ol className="list-decimal list-inside space-y-2 text-gray-700 ml-1">
                    {t.teacherSteps.map((step, idx) => <li key={`teacher-${idx}`}>{step}</li>)}
                  </ol>
                </section>

                <section>
                  <h3 className="text-[18px] font-bold text-pastelGreenText bg-green-100/50 px-3 py-1.5 rounded-md inline-flex items-center gap-2 mb-3"><span className="material-icons">face</span>{t.studentGuide}</h3>
                  <ol className="list-decimal list-inside space-y-2 text-gray-700 ml-1">
                    {t.studentSteps.map((step, idx) => <li key={`student-${idx}`}>{step}</li>)}
                  </ol>
                </section>

                <section className="bg-gray-50 p-5 rounded-xl border border-gray-200">
                  <h3 className="text-[18px] font-bold text-gray-800 flex items-center gap-2 mb-3"><span className="material-icons text-purple-600">shield</span>{t.securityTitle}</h3>
                  <ul className="space-y-3 text-[14px] text-gray-700">
                    {t.securitySteps.map((step, idx) => <li key={`security-${idx}`}>{step}</li>)}
                  </ul>
                </section>
              </div>

              <div className="bg-gray-50 border-t border-gray-100 px-6 py-4 flex justify-end shrink-0">
                <button onClick={() => setShowHelpModal(false)} className="min-h-[44px] rounded-xl px-6 py-2 bg-pastelBlue hover:bg-pastelBlueHover text-pastelBlueText font-bold transition-all hover:-translate-y-0.5 hover:shadow-md">{t.confirm}</button>
              </div>
            </div>
          </div>
        )}

        {showSubmitLinkModal && (
          <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowSubmitLinkModal(false)}>
            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden" onClick={(e) => e.stopPropagation()}>
              <div className="bg-gradient-to-r from-blue-100 to-pink-100 border-b border-blue-100 px-6 py-4 flex items-center justify-between">
                <h2 className="text-[18px] font-bold text-gray-800 flex items-center gap-2"><span className="material-icons">link</span>{t.submitLinkTitle}</h2>
                <button onClick={() => setShowSubmitLinkModal(false)} className="text-gray-400 hover:text-gray-700 transition-colors p-1"><span className="material-icons">close</span></button>
              </div>
              <div className="p-6 space-y-4">
                <p className="text-sm text-gray-600 leading-relaxed">{t.submitLinkDesc}</p>
                <input
                  type="text"
                  value={padletInput}
                  onChange={(e) => setPadletInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') { handleApplySubmissionLink(); setShowSubmitLinkModal(false); } }}
                  placeholder={t.padletPlaceholder}
                  className="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-gray-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200"
                  autoFocus
                />
              </div>
              <div className="bg-gray-50 border-t border-gray-100 px-6 py-4 flex flex-wrap justify-end gap-2">
                {padletInput && (
                  <button
                    onClick={() => { setPadletInput(''); setActivePadlet(''); setEmbedMeta({ type: '', url: '', fallbackUrl: '' }); setEmbedFailed(false); setCanvaEmbedAttempt(false); setShowSubmitLinkModal(false); }}
                    className="min-h-[40px] rounded-xl px-4 py-2 bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold transition-colors"
                  >
                    {t.remove}
                  </button>
                )}
                <button onClick={() => setShowSubmitLinkModal(false)} className="min-h-[40px] rounded-xl px-4 py-2 bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold transition-colors">{t.cancel}</button>
                <button onClick={() => { handleApplySubmissionLink(); setShowSubmitLinkModal(false); }} className="min-h-[40px] rounded-xl px-5 py-2 bg-[#1D4ED8] hover:bg-[#1E40AF] text-white text-sm font-bold transition-colors">{t.save}</button>
              </div>
            </div>
          </div>
        )}

        {showShareModal && (
          <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowShareModal(false)}>
            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden" onClick={(e) => e.stopPropagation()}>
              <div className="bg-gradient-to-r from-blue-100 to-pink-100 border-b border-blue-100 px-6 py-4 flex items-center justify-between">
                <h2 className="text-[18px] font-bold text-gray-800 flex items-center gap-2"><span className="material-icons">ios_share</span>{t.shareTitle}</h2>
                <button onClick={() => setShowShareModal(false)} className="text-gray-400 hover:text-gray-700 transition-colors p-1"><span className="material-icons">close</span></button>
              </div>
              <div className="p-6 space-y-4">
                <p className="text-sm text-gray-600 leading-relaxed">{t.shareModalDesc}</p>
                <div
                  onClick={() => setAllowStudentText(v => !v)}
                  role="switch"
                  aria-checked={allowStudentText}
                  className="flex items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 cursor-pointer select-none hover:bg-slate-100 transition-colors"
                >
                  <span className={`mt-0.5 relative shrink-0 w-11 h-6 rounded-full transition-colors ${allowStudentText ? 'bg-blue-600' : 'bg-slate-300'}`}>
                    <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform ${allowStudentText ? 'translate-x-5' : ''}`} />
                  </span>
                  <span className="min-w-0">
                    <span className="block text-sm font-semibold text-gray-800">{t.studentTextLabel}</span>
                    <span className="block text-xs text-gray-500 leading-relaxed mt-0.5">{t.studentTextDesc}</span>
                  </span>
                </div>
              </div>
              <div className="bg-gray-50 border-t border-gray-100 px-6 py-4 flex flex-wrap justify-end gap-2">
                <button onClick={() => setShowShareModal(false)} className="min-h-[40px] rounded-xl px-4 py-2 bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold transition-colors">{t.cancel}</button>
                <button onClick={() => { handleShare(); setShowShareModal(false); }} className="min-h-[40px] rounded-xl px-5 py-2 bg-[#1D4ED8] hover:bg-[#1E40AF] text-white text-sm font-bold transition-colors flex items-center gap-1.5"><span className="material-icons text-[18px]">content_copy</span>{t.copyLink}</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
